<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Admin — Edit site content</title>
    <style>
      body { font-family: system-ui, Arial; margin: 24px; }
      textarea { width: 100%; height: 320px; font-family: monospace; }
      .file { cursor: pointer; padding: 6px; border-bottom: 1px solid #eee; }
      .file:hover { background: #fafafa; }
      label.inline { display:inline-block; margin-right:8px; }
    </style>
  </head>
  <body>
    <h1>Admin — Site Content</h1>

    <div style="margin-bottom:12px;">
      <label class="inline">Admin password:</label>
      <input id="adminPass" type="password" style="width:320px" placeholder="Enter admin password" />
      <button id="savePass">Set</button>
      <span id="passStatus" style="margin-left:12px;color:#666"></span>
    </div>

    <div style="display:flex; gap:16px;">
      <div style="width:320px;">
        <button id="refresh">Refresh file list</button>
        <div id="files" style="margin-top:8px;"></div>
      </div>

      <div style="flex:1;">
        <div>
          <label>Path: <input id="path" style="width:70%"/></label>
        </div>
        <div>
          <textarea id="content"></textarea>
        </div>
        <div style="margin-top:8px;">
          <button id="save">Save</button>
          <button id="create">Create New</button>
          <button id="delete">Delete</button>
        </div>
        <pre id="status" style="margin-top:12px;"></pre>
      </div>
    </div>

    <script>
      let currentSha = null
      let adminPass = ''

      function headers() {
        const h = { 'Content-Type': 'application/json' }
        if (adminPass) h['x-admin-password'] = adminPass
        return h
      }

      async function listFiles() {
        document.getElementById('status').textContent = 'Listing...'
        const r = await fetch('/api/files?path=content/pages', { headers: headers() })
        const j = await r.json()
        const filesEl = document.getElementById('files')
        filesEl.innerHTML = ''
        if (j.type === 'dir' && Array.isArray(j.entries)) {
          j.entries.forEach(e => {
            const d = document.createElement('div')
            d.className = 'file'
            d.textContent = e.name + (e.type === 'dir' ? '/' : '')
            d.onclick = () => loadFile('content/pages/' + e.name)
            filesEl.appendChild(d)
          })
        } else {
          filesEl.textContent = 'No files'
        }
        document.getElementById('status').textContent = ''
      }

      async function loadFile(path) {
        document.getElementById('status').textContent = 'Loading...'
        const r = await fetch('/api/files?path=' + encodeURIComponent(path), { headers: headers() })
        const j = await r.json()
        if (j.type === 'file') {
          document.getElementById('path').value = path
          document.getElementById('content').value = j.content
          currentSha = j.sha
          document.getElementById('status').textContent = 'Loaded ' + path
        } else {
          document.getElementById('status').textContent = JSON.stringify(j)
        }
      }

      async function saveFile(create=false) {
        const path = document.getElementById('path').value
        const content = document.getElementById('content').value
        if (!path) return alert('Set a path')
        const body = { path, content, sha: create ? undefined : currentSha, message: create ? 'Create via admin' : 'Update via admin' }
        const r = await fetch('/api/files', { method: 'PUT', headers: headers(), body: JSON.stringify(body) })
        const j = await r.json()
        document.getElementById('status').textContent = JSON.stringify(j)
        if (j.content && j.content.sha) currentSha = j.content.sha
        await listFiles()
      }

      async function deleteFile() {
        const path = document.getElementById('path').value
        if (!path) return alert('Set a path')
        if (!confirm('Delete ' + path + '?')) return
        const r = await fetch('/api/files', { method: 'DELETE', headers: headers(), body: JSON.stringify({ path, sha: currentSha }) })
        const j = await r.json()
        document.getElementById('status').textContent = JSON.stringify(j)
        document.getElementById('path').value=''
        document.getElementById('content').value=''
        currentSha = null
        await listFiles()
      }

      document.getElementById('refresh').onclick = listFiles
      document.getElementById('save').onclick = () => saveFile(false)
      document.getElementById('create').onclick = () => saveFile(true)
      document.getElementById('delete').onclick = deleteFile
      document.getElementById('savePass').onclick = () => {
        adminPass = document.getElementById('adminPass').value || ''
        document.getElementById('passStatus').textContent = adminPass ? 'Password set' : 'No password'
      }

      listFiles()
    </script>
  </body>
</html>
